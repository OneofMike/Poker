 $(&#x27;handName&#x27;).textContent=pre?&#x27;Preflop&#x27;:names[evalHand([...h,...validBoard]).cat];
 $(&#x27;prob&#x27;).textContent=&#x27;…&#x27;;$(&#x27;status&#x27;).textContent=&#x27;Calculating&#x27;;
 const used=new Set([...h,...validBoard]),remaining=all.filter(c=&gt;!used.has(c));
 const oppCount=+$(&#x27;opps&#x27;).value,style=$(&#x27;style&#x27;).value;
 const show=(pct,status)=&gt;{if(t!==token)return;$(&#x27;prob&#x27;).textContent=pct&gt;0&amp;&amp;pct&lt;.05?&#x27;&lt;0.1%&#x27;:pct.toFixed(1)+&#x27;%&#x27;;$(&#x27;status&#x27;).textContent=status};
 if(river&amp;&amp;oppCount===1){const r=exactRiverOne(h,validBoard,remaining,style);show(r.pct,`Exact · ${style} range · 990 possible holdings`);return}
 // Monte Carlo: sample each opponent&#x27;s two cards without replacement, using
 // explicit normalized weights for all remaining combinations.
 // Cache each card pair&#x27;s weight, and draw from legal pairs per opponent.
 const weight=new Float64Array(52*52);
 for(let i=0;i&lt;52;i++)for(let j=i+1;j&lt;52;j++)weight[i*52+j]=rangeWeight(i,j,style);
 function pick(deck){let sum=0,chosenI=-1,chosenJ=-1;
  for(let i=0;i&lt;deck.length-1;i++)for(let j=i+1;j&lt;deck.length;j++){
   const a=deck[i],b=deck[j],w=weight[Math.min(a,b)*52+Math.max(a,b)];sum+=w;
   if(Math.random()*sum&lt;w){chosenI=i;chosenJ=j}
  }
  const a=deck[chosenI],b=deck[chosenJ];deck.splice(chosenJ,1);deck.splice(chosenI,1);return [a,b]
 }
 let wins=0,tieShares=0,total=0;
 const n=pre?3000:river?5000:3500;
 const work=()=&gt;{if(t!==token)return;const batch=Math.min(65,n-total);
  for(let z=0;z&lt;batch;z++){
   const deck=remaining.slice(),opponents=[];
   for(let o=0;o&lt;oppCount;o++)opponents.push(pick(deck));
   const board=validBoard.slice();
   if(pre)for(let j=0;j&lt;5;j++){const k=Math.floor(Math.random()*deck.length);board.push(deck[k]);deck[k]=deck[deck.length-1];deck.pop()}
   const heroScore=evalHand([...h,...board]).val;let higher=false,eq=0;
   for(const opp of opponents){const v=evalHand([...opp,...board]).val;if(v&gt;heroScore){higher=true;break}if(v===heroScore)eq++}
   if(!higher){if(eq===0)wins++;else tieShares+=1/(eq+1)}total++
  }
  if(total&lt;n)setTimeout(work,0);else show(100*(wins+tieShares)/total,`${total.toLocaleString()} sampled deals · ${style} range${wins+tieShares===0?&#x27; · no wins sampled&#x27;:&#x27;&#x27;}`)
 };setTimeout(work,0)
}

<script>
const ranks=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
function score(a,b,s){const i=ranks.indexOf(a),j=ranks.indexOf(b);if(i===j)return 100-i*4;const hi=Math.min(i,j),lo=Math.max(i,j),gap=lo-hi-1;let v=77-hi*4-gap*3+(s?8:0);if(hi===0)v+=8;if(hi<=3&&lo<=4)v+=5;if(hi>=7)v-=5;return v}
const hands=ranks.flatMap((a,i)=>ranks.map((b,j)=>{const pair=i===j,suited=i<j;return {name:pair?a+a:suited?a+b+'s':b+a+'o',a:pair?a:suited?a:b,b:pair?b:suited?b:a,pair,suited,score:score(a,b,suited)}})).sort((a,b)=>b.score-a.score);
const tier=h=>h.score>=90?'Premium':h.score>=77?'Very strong':h.score>=64?'Playable':h.score>=50?'Situational':'Weak';
const tiers=['Premium','Very strong','Playable','Situational','Weak'];let currentKind='all';let selected=null;
const list=document.getElementById('list'),count=document.getElementById('count'),strength=document.getElementById('strength'),search=document.getElementById('search'),chips=document.getElementById('chips');
function card(rank,suit){return `<span class="card ${/[♥♦]/.test(suit)?'red':''}" aria-label="${rank==='T'?'10':rank} ${suit}"><span class="rank">${rank==='T'?'10':rank}</span><span class="suit">${suit}</span></span>`}
function whenToPlay(h){
 const high=ranks.indexOf(h.a)<=ranks.indexOf(h.b)?h.a:h.b;
 const low=high===h.a?h.b:h.a;
 const hi=ranks.indexOf(high),lo=ranks.indexOf(low);
 const gap=lo-hi;
 const short=playerCount<=3;
 if(h.pair){
  if(hi<=3)return 'Raise for value from most positions; strong enough to continue against action, depending on its size.';
  if(hi<=6)return 'Often worth opening with a raise; be more cautious against large reraises and higher flops.';
  return short?'Often playable with fewer opponents; consider raising when first in, but beware big reraises.':'Best in later position or for a modest price; aim for a set and avoid overcommitting on high flops.';
 }
 if(high==='A'){
  if(lo<=3)return h.suited?'Strong raising hand from most positions; suitedness adds flush potential.':'Strong opening hand; usually raise, but respect big reraises from tight players.';
  if(lo<=6)return h.suited?'Often raise when first in, especially in middle or late position; beware stronger aces.':'Prefer late position or fewer players; weaker kickers can be dominated.';
  return h.suited?'Mostly a late-position or short-handed open; flush potential helps, but weak kickers matter.':'Usually fold early; consider a late-position open when action folds to you.';
 }
 if(hi<=3&&lo<=4){
  return h.suited?'Good candidate to raise from middle or late position; can make strong pairs and draws.':'Playable mainly from middle or late position; watch for stronger kickers when facing raises.';
 }
 if(gap===1){
  if(h.suited)return hi<=6?'Playable from middle or late position; connected cards can make straights and flushes.':'Usually a late-position or inexpensive-pot hand; relies on hitting draws or strong flops.';
  return hi<=5?'Mostly a late-position open when nobody has raised; pairs may be vulnerable.':'Usually fold early; occasionally play late in an unopened pot.';
 }
 if(gap===2&&h.suited)return 'Consider in late position when the pot is unopened or inexpensive; can make straights and flushes.';
 if(h.suited)return hi<=5?'Situational late-position hand; suitedness helps, but avoid calling large raises.':'Usually fold unless late and the price is small; flush potential alone is not enough.';
 if(short&&hi<=6)return 'More usable short-handed when action folds to you; prefer raising over limping.';
 return hi<=5?'Mostly a late-position hand when action folds to you; avoid strong raises.':'Usually fold, especially early or against a raise; weak pair and draw potential.';
}
function description(h){
 const intro=h.pair?'Pocket pair':h.suited?'Suited':'Offsuit';
 const stronger=hands.filter(other=>other.score>h.score);
 const cards=stronger.length?`<div style="display:flex;flex-wrap:wrap;gap:7px">${stronger.map(opp=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid var(--border);border-radius:9px">${card(opp.a,'♠')}${card(opp.b,opp.pair?'♥':opp.suited?'♠':'♦')}<span style="font-size:12px">${opp.name}</span></span>`).join('')}</div>`:'<small>No hands ranked higher.</small>';
 return `<div class="detail"><p>${intro}</p><small>${adjustedTier(h)}</small><p style="margin:12px 0 5px;font-weight:650">Starting hands stronger than ${h.name}</p>${cards}</div>`;
}
function render(){const q=search.value.trim().toLowerCase().replaceAll('10','t').replaceAll(' ','');const target=strength.value;const filtered=hands.filter(h=>(target==='All strengths'||adjustedTier(h)===target)&&(currentKind==='all'||currentKind==='pairs'&&h.pair||currentKind==='suited'&&h.suited||currentKind==='offsuit'&&!h.suited&&!h.pair)&&h.name.toLowerCase().includes(q));count.textContent=`${filtered.length} hands`;list.innerHTML=filtered.length?filtered.map(h=>`<article class="hand"><button type="button" data-hand="${h.name}" aria-expanded="${selected===h.name}"><span class="cards">${card(h.a,'♠')}${card(h.b,h.pair?'♥':h.suited?'♠':'♦')}</span><span class="hand-label"><strong>${h.name}</strong><span class="${adjustedTier(h).toLowerCase().replace(' ','-')}">${adjustedTier(h)}</span><span class="use-note">${whenToPlay(h)}</span></span><span class="chev">${selected===h.name?'⌃':'⌄'}</span></button>${selected===h.name?description(h):''}</article>`).join(''):`<div class="empty">No hands match these filters.<br><button id="reset">Clear filters</button></div>`;chips.innerHTML=tiers.map(t=>`<button data-tier="${t}" class="${target===t?'active':''}" aria-pressed="${target===t}">${t}</button>`).join('')}
list.addEventListener('click',e=>{let el=e.target.closest('[data-hand]');if(el){selected=selected===el.dataset.hand?null:el.dataset.hand;render()}else if(e.target.closest('#reset')){strength.value='All strengths';search.value='';currentKind='all';selected=null;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind==='all'));render()}});chips.addEventListener('click',e=>{const b=e.target.closest('[data-tier]');if(!b)return;strength.value=strength.value===b.dataset.tier?'All strengths':b.dataset.tier;render();list.scrollTop=0});document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(!b)return;currentKind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render();list.scrollTop=0});search.addEventListener('input',render);strength.addEventListener('change',()=>{render();list.scrollTop=0});
let playerCount=6;
const combos=[['Royal flush',['A♠','K♠','Q♠','J♠','10♠'],'A through 10, all the same suit'],['Straight flush',['9♥','8♥','7♥','6♥','5♥'],'Five consecutive cards, same suit'],['Four of a kind',['K♠','K♥','K♦','K♣','3♠'],'Four cards of the same rank'],['Full house',['Q♠','Q♥','Q♦','7♣','7♥'],'Three of a kind plus a pair'],['Flush',['A♦','J♦','8♦','5♦','2♦'],'Five cards of the same suit'],['Straight',['9♠','8♦','7♥','6♣','5♠'],'Five consecutive ranks'],['Three of a kind',['8♠','8♥','8♦','K♣','2♠'],'Three cards of the same rank'],['Two pair',['J♠','J♦','4♥','4♣','A♠'],'Two different pairs'],['One pair',['10♠','10♥','A♦','7♣','3♠'],'Two cards of the same rank'],['High card',['A♠','J♦','9♣','6♥','3♠'],'No pair or stronger combination']];
document.getElementById('rank-list').innerHTML=combos.slice().reverse().map(([name,cards,desc],i)=>`<article class="rankitem"><div class="rankhead"><span class="num">${i+1}</span><span><div class="ranktitle">${name}</div><div class="rankdesc">${desc}</div></span>${i===9?'<span class="tag">Strongest</span>':i===0?'<span class="tag" style="color:var(--muted)">Weakest</span>':''}</div><div class="five">${cards.map(c=>card(c.slice(0,-1),c.slice(-1))).join('')}</div></article>`).join('');render();

function adjustedScore(h){const bonus={6:0,5:3,4:6,3:10,2:15}[playerCount];return Math.min(100,h.score+bonus)}
function adjustedTier(h){const v=adjustedScore(h);return v>=90?'Premium':v>=77?'Very strong':v>=64?'Playable':v>=50?'Situational':'Weak'}
document.getElementById('player-count').addEventListener('change',e=>{playerCount=Number(e.target.value);selected=null;render();list.scrollTop=0});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tabpage').forEach(x=>x.hidden=x.id!=='tab-'+b.dataset.tab)}));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
